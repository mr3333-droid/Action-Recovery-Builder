name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: "Device tree repository URL (GitHub or GitLab)"
        required: true
        type: string
        default: ""
      device_tree_branch:
        description: "Device tree branch"
        required: true
        type: string
        default: "main"
      device_path:
        description: "Device path (example: device/xiaomi/zorn)"
        required: true
        type: string
        default: "device/xiaomi/zorn"
      device_name:
        description: "Device codename"
        required: true
        type: string
        default: "zorn"
      makefile_name:
        description: "Lunch product name"
        required: true
        type: string
        default: "twrp_zorn"
      build_target:
        description: "Build target"
        required: true
        type: choice
        default: recovery
        options:
          - recovery
          - boot
          - vendorboot
      create_release:
        description: "Create a public GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    uses: ./.github/workflows/_build-core.yml
    with:
      build_flavor: orangefox
      build_label: OrangeFox
      manifest_url: https://gitlab.com/OrangeFox/sync.git
      manifest_branch: "14.1"
      lunch_suffix: ap2a-eng
      device_tree_url: ${{ inputs.device_tree_url }}
      device_tree_branch: ${{ inputs.device_tree_branch }}
      device_path: ${{ inputs.device_path }}
      device_name: ${{ inputs.device_name }}
      makefile_name: ${{ inputs.makefile_name }}
      build_target: ${{ inputs.build_target }}
      create_release: ${{ inputs.create_release }}
    secrets: inherit
