name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: "Device tree repository URL (GitHub or GitLab)"
        required: true
        type: string
        default: ""

      device_tree_branch:
        description: "Device tree branch"
        required: true
        type: string
        default: ""

      device_path:
        description: "Device path (ex: device/xiaomi/zorn)"
        required: true
        type: string
        default: ""

      device_name:
        description: "Device codename (ex: zorn)"
        required: true
        type: string
        default: ""

      makefile_name:
        description: "Makefile name (ex: twrp_zorn)"
        required: true
        type: string
        default: ""

      build_target:
        description: "Build target"
        required: true
        type: choice
        default: recovery
        options:
          - recovery
          - boot
          - vendorboot

      dt_token:
        description: "Personal Access Token (leave empty for public repos)"
        required: false
        type: string
        default: ""

      telegram_bot_token:
        description: "Telegram Bot Token (leave empty to disable)"
        required: false
        type: string
        default: ""

      telegram_chat_id:
        description: "Telegram Chat ID (leave empty to disable)"
        required: false
        type: string
        default: ""

      create_release:
        description: "Create public GitHub Release?"
        required: true
        type: choice
        default: "No — Artifacts only (private)"
        options:
          - "Yes — Create Release (public)"
          - "No — Artifacts only (private)"

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      SYNC_URL: https://gitlab.com/OrangeFox/sync.git
      MANIFEST_BRANCH: "14.1"
      DEVICE_TREE_URL: ${{ inputs.device_tree_url }}
      DEVICE_TREE_BRANCH: ${{ inputs.device_tree_branch }}
      DEVICE_PATH: ${{ inputs.device_path }}
      DEVICE_NAME: ${{ inputs.device_name }}
      MAKEFILE_NAME: ${{ inputs.makefile_name }}
      BUILD_TARGET: ${{ inputs.build_target }}
      DT_TOKEN: ${{ inputs.dt_token }}
      TG_BOT_TOKEN: ${{ inputs.telegram_bot_token }}
      TG_CHAT_ID: ${{ inputs.telegram_chat_id }}
      CREATE_RELEASE: ${{ inputs.create_release }}
      WATCH_UNTIL_SECONDS: 20700
      WATCH_INTERVAL_SECONDS: 600

    steps:

    - name: Setup Advanced Telegram Dashboard Engine
      run: |
        if [ -n "${{ env.TG_BOT_TOKEN }}" ]; then
          echo "::add-mask::${{ env.TG_BOT_TOKEN }}"
        fi
        echo $(date +%s) > /tmp/build_start_time

        python3 -c "import sys, textwrap; open('/tmp/notify.py', 'w').write(textwrap.dedent(sys.stdin.read()))" <<'EOF'
        import os, sys, time, json, urllib.request, urllib.parse

        token = os.getenv("TG_BOT_TOKEN")
        chat_id = os.getenv("TG_CHAT_ID")
        msg_id = os.getenv("TG_MSG_ID")

        if not token or not chat_id:
            sys.exit(0)

        start_file = "/tmp/build_start_time"
        start_time = int(open(start_file).read().strip()) if os.path.exists(start_file) else int(time.time())
        now = int(time.time())
        elapsed = max(0, now - start_time)
        e_min, e_sec = elapsed // 60, elapsed % 60
        elapsed_str = f"{e_min}m {e_sec}s"

        percent = int(sys.argv[1]) if len(sys.argv) > 1 else 0
        current_step = int(sys.argv[2]) if len(sys.argv) > 2 else 1
        mode = sys.argv[3] if len(sys.argv) > 3 else "update"
        custom_status = sys.argv[4] if len(sys.argv) > 4 else ""

        if 0 < percent < 100:
            est_total = int(elapsed * 100 / percent)
            rem = max(0, est_total - elapsed)
            r_min, r_sec = rem // 60, rem % 60
            rem_str = f"~{r_min}m {r_sec}s"
        elif percent >= 100:
            rem_str = "0m 0s"
        else:
            rem_str = "Calculating..."

        filled = int(20 * percent // 100)
        bar = "█" * filled + "░" * (20 - filled)

        device = os.getenv("DEVICE_NAME", "Unknown")
        branch = os.getenv("MANIFEST_BRANCH", "14.1")
        target = os.getenv("BUILD_TARGET", "recovery")
        commit = os.getenv("LATEST_COMMIT", "Pending")
        commit_url = os.getenv("COMMIT_URL", "")
        run_id = os.getenv("GITHUB_RUN_ID", "")
        repo = os.getenv("GITHUB_REPOSITORY", "")
        run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

        steps = [
            "1. Server Setup & Dependencies",
            "2. Source Code Sync",
            "3. Device Tree Clone",
            "4. Target Environment Setup",
            "5. Recovery Compilation (mka)",
            "6. Artifact Output Check",
            "7. Release & Artifact Upload"
        ]

        steps_text = ""
        for idx, s in enumerate(steps, 1):
            if idx < current_step:
                icon = "  ✅ "
            elif idx == current_step:
                icon = "  ❌ " if custom_status == "failed" else "  ⏳ "
            else:
                icon = "  ⏹ "
            steps_text += f"{icon}*{s}*\n"

        commit_text = f"[`{commit}`]({commit_url})" if commit_url and commit != "Pending" else f"`{commit}`"

        if custom_status == "failed":
            header = "❌ *RECOVERY BUILD FAILED*"
            footer = f"⚠️ *Build failed at Step {current_step}!*\n🔗 [View Error Logs on GitHub]({run_url})"
        elif percent >= 100:
            header = "🎉 *RECOVERY BUILT SUCCESSFULLY!*"
            release_url = os.getenv("RELEASE_URL", run_url)
            footer = f"🚀 *Build completed in {elapsed_str}!*\n📦 [Download Release / Artifacts]({release_url})"
        else:
            header = "🛠 *REAL-TIME BUILD DASHBOARD*"
            footer = f"🔗 [View Workflow Run on GitHub]({run_url})"

        text = f"""{header}
─────────────────────────────
📱 *Device:* `{device}`
🌿 *Manifest:* `{branch}` | *Target:* `{target}`
🌲 *Commit Tree:* {commit_text}
─────────────────────────────
📊 *Progress:* `[{bar}]` *{percent}%*
⏱ *Elapsed:* `{elapsed_str}` | ⌛ *Remaining:* `{rem_str}`
─────────────────────────────
📌 *BUILD STEPS:*
{steps_text}─────────────────────────────
{footer}"""

        if mode == "init":
            url = f"https://api.telegram.org/bot{token}/sendMessage"
            data = urllib.parse.urlencode({
                "chat_id": chat_id, "text": text, "parse_mode": "Markdown", "disable_web_page_preview": "true"
            }).encode()
            try:
                req = urllib.request.Request(url, data=data)
                with urllib.request.urlopen(req) as resp:
                    res = json.loads(resp.read().decode())
                    m_id = res.get("result", {}).get("message_id")
                    if m_id:
                        with open(os.environ["GITHUB_ENV"], "a") as f:
                            f.write(f"TG_MSG_ID={m_id}\n")
            except Exception as e:
                print("TG Init Error:", e)
        else:
            if not msg_id:
                sys.exit(0)
            url = f"https://api.telegram.org/bot{token}/editMessageText"
            data = urllib.parse.urlencode({
                "chat_id": chat_id, "message_id": msg_id, "text": text, "parse_mode": "Markdown", "disable_web_page_preview": "true"
            }).encode()
            try:
                req = urllib.request.Request(url, data=data)
                urllib.request.urlopen(req)
            except Exception as e:
                print("TG Update Error:", e)
        EOF
        chmod +x /tmp/notify.py
        python3 /tmp/notify.py 5 1 init

    - name: Verify device tree access
      run: |
        DT_URL="${{ env.DEVICE_TREE_URL }}"
        ORIGINAL_URL="$DT_URL"
        TOKEN="${{ env.DT_TOKEN }}"
        
        if [ -n "$TOKEN" ]; then
          echo "::add-mask::$TOKEN"
          if echo "$DT_URL" | grep -q "github.com"; then
            DT_URL=$(echo "$DT_URL" | sed "s|https://github.com/|https://oauth2:${TOKEN}@github.com/|")
          elif echo "$DT_URL" | grep -q "gitlab.com"; then
            DT_URL=$(echo "$DT_URL" | sed "s|https://gitlab.com/|https://oauth2:${TOKEN}@gitlab.com/|")
          fi
        fi
        
        echo "AUTH_URL=$DT_URL" >> $GITHUB_ENV
        echo "ORIGINAL_URL=$ORIGINAL_URL" >> $GITHUB_ENV
        
        if git ls-remote --exit-code "$DT_URL" 2>/dev/null; then
          echo "Device tree accessible. Continuing build..."
        else
          echo "FATAL: Cannot access device tree."
          exit 1
        fi

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        python3 /tmp/notify.py 15 1 update
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 tar aria2
        curl -L -O "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"
        sudo bash android_build_env.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Sync OrangeFox sources and minimal manifest
      run: |
        python3 /tmp/notify.py 30 2 update
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone --depth=1 ${{ env.SYNC_URL }}
        cd sync
        ./orangefox_sync.sh --branch ${{ env.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        python3 /tmp/notify.py 45 3 update
        cd "${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}"
        git clone --depth=1 "${{ env.AUTH_URL }}" -b "${{ env.DEVICE_TREE_BRANCH }}" "./${{ env.DEVICE_PATH }}"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Get latest device tree commit
      id: devtree_commit
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}
        LATEST_COMMIT=$(git rev-parse --short=7 HEAD)
        LATEST_COMMIT_FULL=$(git rev-parse HEAD)
        echo "LATEST_COMMIT=$LATEST_COMMIT" >> $GITHUB_OUTPUT
        echo "LATEST_COMMIT_FULL=$LATEST_COMMIT_FULL" >> $GITHUB_OUTPUT
        
        DISPLAY_URL=$(echo "${{ env.ORIGINAL_URL }}" | sed 's|https://oauth2:[^@]*@|https://|')
        COMMIT_URL="${DISPLAY_URL}/tree/${LATEST_COMMIT}"
        
        echo "LATEST_COMMIT=$LATEST_COMMIT" >> $GITHUB_ENV
        echo "COMMIT_URL=$COMMIT_URL" >> $GITHUB_ENV
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 40

    - name: Building recovery
      run: |
        python3 /tmp/notify.py 60 5 update
        cd "${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}"
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch ${{ env.MAKEFILE_NAME }}-ap2a-eng
        
        if ! mka adbd ${{ env.BUILD_TARGET }}image -j$(nproc --all); then
          exit 1
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Notify Build Failure
      if: failure()
      run: |
        [ -f /tmp/notify.py ] && python3 /tmp/notify.py 60 5 update failed
        exit 1

    - name: Prepare build output paths
      id: prepare_outputs
      run: |
        python3 /tmp/notify.py 85 6 update
        OUT_DIR="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}"
        
        if [ "${{ env.BUILD_TARGET }}" = "vendorboot" ]; then
          IMG_NAME="vendor_boot.img"
        elif [ "${{ env.BUILD_TARGET }}" = "boot" ]; then
          IMG_NAME="boot.img"
        else
          IMG_NAME="recovery.img"
        fi
        
        IMG_PATH="$OUT_DIR/$IMG_NAME"
        ZIP_PATH=$(ls $OUT_DIR/OrangeFox-R*.zip 2>/devnull | head -n 1 || true)
        
        echo "IMG_PATH=$IMG_PATH" >> $GITHUB_ENV
        echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV

    - name: Upload to Release
      if: ${{ env.CREATE_RELEASE == 'Yes — Create Release (public)' }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.IMG_PATH }}
          ${{ env.ZIP_PATH }}
        name: ${{ env.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ env.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }}
          Target: ${{ env.BUILD_TARGET }}
          Device tree commit: [${{ steps.devtree_commit.outputs.LATEST_COMMIT }}](${{ env.ORIGINAL_URL }}/tree/${{ steps.devtree_commit.outputs.LATEST_COMMIT }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Image Artifact (private)
      if: ${{ env.CREATE_RELEASE != 'Yes — Create Release (public)' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.DEVICE_NAME }}-${{ env.BUILD_TARGET }}-img
        path: ${{ env.IMG_PATH }}
        retention-days: 90

    - name: Upload Installer Zip Artifact (private)
      if: ${{ env.CREATE_RELEASE != 'Yes — Create Release (public)' && env.ZIP_PATH != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.DEVICE_NAME }}-installer-zip
        path: ${{ env.ZIP_PATH }}
        retention-days: 90

    - name: Notify Build Complete
      if: success()
      run: |
        if [ "${{ env.CREATE_RELEASE }}" = "Yes — Create Release (public)" ]; then
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_RUN_ID}" >> $GITHUB_ENV
        else
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> $GITHUB_ENV
        fi
        
        python3 /tmp/notify.py 100 7 update

    - name: Watch for device tree changes and dirty build
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        START_TIME=$(date +%s)
        BUILD_COUNT=0
        CURRENT_COMMIT="${{ steps.devtree_commit.outputs.LATEST_COMMIT_FULL }}"
        WORKSPACE="${{ steps.pwd.outputs.workspace-folder }}"
        FOX_DIR="$WORKSPACE/fox_${{ env.MANIFEST_BRANCH }}"
        DEVICE_DIR="$FOX_DIR/${{ env.DEVICE_PATH }}"
        OUT_DIR="$FOX_DIR/out/target/product/${{ env.DEVICE_NAME }}"
        
        while true; do
          NOW=$(date +%s)
          ELAPSED=$((NOW - START_TIME))
          if [ "$ELAPSED" -ge "${{ env.WATCH_UNTIL_SECONDS }}" ]; then
            break
          fi
          sleep "${{ env.WATCH_INTERVAL_SECONDS }}"
          NOW=$(date +%s)
          ELAPSED=$((NOW - START_TIME))
          if [ "$ELAPSED" -ge "${{ env.WATCH_UNTIL_SECONDS }}" ]; then
            break
          fi
          cd "$DEVICE_DIR"
          git fetch origin "${{ env.DEVICE_TREE_BRANCH }}"
          NEW_COMMIT=$(git rev-parse "origin/${{ env.DEVICE_TREE_BRANCH }}")
          NEW_COMMIT_SHORT=$(echo "$NEW_COMMIT" | cut -c1-7)
          CURRENT_COMMIT_SHORT=$(echo "$CURRENT_COMMIT" | cut -c1-7)
          if [ "$NEW_COMMIT" = "$CURRENT_COMMIT" ]; then
            continue
          fi
          BUILD_COUNT=$((BUILD_COUNT + 1))
          
          echo $(date +%s) > /tmp/build_start_time
          echo "LATEST_COMMIT=$NEW_COMMIT_SHORT" >> $GITHUB_ENV
          
          python3 /tmp/notify.py 50 5 update

          git reset --hard "$NEW_COMMIT"
          CURRENT_COMMIT="$NEW_COMMIT"
          cd "$FOX_DIR"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          set -e
          lunch ${{ env.MAKEFILE_NAME }}-bp2a-eng
          
          if ! mka adbd ${{ env.BUILD_TARGET }}image -j$(nproc --all); then
            python3 /tmp/notify.py 50 5 update failed
            continue
          fi
          
          if [ "${{ env.BUILD_TARGET }}" = "vendorboot" ]; then
            IMG_NAME="vendor_boot.img"
          elif [ "${{ env.BUILD_TARGET }}" = "boot" ]; then
            IMG_NAME="boot.img"
          else
            IMG_NAME="recovery.img"
          fi
          
          ZIP_FILE=$(ls "$OUT_DIR"/OrangeFox-R*.zip 2>/devnull | head -n 1 || true)
          TAG_NAME="${{ github.run_id }}-${BUILD_COUNT}"
          RELEASE_NAME="${{ env.DEVICE_NAME }}-${TAG_NAME}"
          
          gh release create "$TAG_NAME" \
            "$OUT_DIR/$IMG_NAME" \
            $ZIP_FILE \
            --title "$RELEASE_NAME" \
            --notes "Dirty build: #${BUILD_COUNT}"
            
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_ENV
          
          python3 /tmp/notify.py 100 7 update
        done
        
