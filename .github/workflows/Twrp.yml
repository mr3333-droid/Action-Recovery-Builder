name: TWRP Build

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: "Device tree repository URL (GitHub or GitLab)"
        required: true
        type: string
        default: ""
      device_tree_branch:
        description: "Device tree branch"
        required: true
        type: string
        default: "twrp-16.0"
      device_path:
        description: "Device path (example: device/xiaomi/zorn)"
        required: true
        type: string
        default: "device/xiaomi/zorn"
      device_name:
        description: "Device codename"
        required: true
        type: string
        default: "zorn"
      makefile_name:
        description: "Lunch product name"
        required: true
        type: string
        default: "twrp_zorn"
      build_target:
        description: "Build target"
        required: true
        type: choice
        default: recovery
        options:
          - recovery
          - boot
          - vendorboot
      create_release:
        description: "Create a public GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    uses: ./.github/workflows/_build-core.yml
    with:
      build_flavor: twrp
      build_label: TWRP
      manifest_url: https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git
      manifest_branch: twrp-16.0
      lunch_suffix: bp2a-eng
      device_tree_url: ${{ github.event.inputs.device_tree_url }}
      device_tree_branch: ${{ github.event.inputs.device_tree_branch }}
      device_path: ${{ github.event.inputs.device_path }}
      device_name: ${{ github.event.inputs.device_name }}
      makefile_name: ${{ github.event.inputs.makefile_name }}
      build_target: ${{ github.event.inputs.build_target }}
      create_release: ${{ fromJSON(github.event.inputs.create_release) }}
    secrets:
      DT_TOKEN: ${{ secrets.DT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
